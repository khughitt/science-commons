schema_version: 1
name: mmrf-commpass-recipe-manifest
description: >
  Contract for the conservative MMRF CoMMpass progression-risk staging recipe.
  GDC metadata remains the source of truth. AWS S3 locations are intentionally
  omitted until the mirror bucket/key convention is separately verified.

dataset:
  id: dataset:mmrf-commpass
  project_id: MMRF-COMMPASS
  task: progression-risk
  candidate_tasks: [overall-survival]
  candidate_tasks_note: >
    overall-survival is reported per-task in validation.json as a distinct
    benchmark candidate, never a fallback for progression-risk. It is not added
    to entity.md in this slice.
  promotion_state: pointer
  promotion_note: >
    This recipe can produce staging metadata and local package files, but the
    commons entity remains a pointer until a future promotion review verifies a
    runnable datapackage and updates entity.md.

manifest:
  path: manifest/files.parquet
  format: parquet
  source_endpoint: https://api.gdc.cancer.gov/files
  filter:
    op: and
    content:
      - op: in
        content:
          field: cases.project.project_id
          value: [MMRF-COMMPASS]
      - op: in
        content:
          field: access
          value: [open]
      - op: in
        content:
          field: data_type
          value: [Gene Expression Quantification]
      - op: in
        content:
          field: experimental_strategy
          value: [RNA-Seq]
      - op: in
        content:
          field: data_format
          value: [TSV]
  primary_key: [file_id]
  required_columns:
    - file_id
    - file_name
    - data_category
    - data_type
    - data_format
    - experimental_strategy
    - access
    - file_size
    - md5sum
    - case_id
    - case_submitter_id
    - sample_submitter_id
    - sample_type
    - gdc_download_url
  unique_columns:
    - case_submitter_id
    - sample_submitter_id
    - file_id
  columns:
    file_id:
      type: string
      nullable: false
      description: GDC file UUID.
    file_name:
      type: string
      nullable: false
      description: GDC file name.
    data_category:
      type: string
      nullable: false
      allowed_values: [Transcriptome Profiling]
    data_type:
      type: string
      nullable: false
      allowed_values: [Gene Expression Quantification]
    data_format:
      type: string
      nullable: false
      allowed_values: [TSV]
    experimental_strategy:
      type: string
      nullable: false
      allowed_values: [RNA-Seq]
    access:
      type: string
      nullable: false
      allowed_values: [open]
    file_size:
      type: integer
      nullable: true
      minimum: 0
      description: GDC file size in bytes when available.
    md5sum:
      type: string
      nullable: true
      pattern: "^[0-9a-fA-F]{32}$"
      description: GDC MD5 checksum when available.
    case_id:
      type: string
      nullable: false
      description: GDC case UUID linked to exactly one manifest file row.
    case_submitter_id:
      type: string
      nullable: false
      description: Submitter patient id used as the patient split unit.
    sample_submitter_id:
      type: string
      nullable: false
      description: Submitter sample id linked to exactly one manifest file row.
    sample_type:
      type: string
      nullable: true
      description: GDC sample type.
    gdc_download_url:
      type: string
      nullable: false
      pattern: "^https://api\\.gdc\\.cancer\\.gov/data/[0-9a-fA-F-]+$"
      description: GDC data endpoint URL for the selected file.

case_manifest:
  path: manifest/cases.json
  format: json
  source_endpoint: https://api.gdc.cancer.gov/cases
  required_fields:
    - case_id
    - submitter_id
    - diagnoses
  endpoint_fields:
    progression:
      - diagnoses.days_to_recurrence
      - diagnoses.progression_or_recurrence
      - diagnoses.days_to_last_follow_up
    survival_report_only:
      - demographic.vital_status
      - demographic.days_to_death
  notes:
    - Survival metadata is reported per-task as a distinct overall-survival candidate; it is not a fallback for progression-risk promotion.
    - Every manifest case_id must resolve to a case record before package build.

validation_report:
  path: reports/validation.json
  format: json
  required_fields:
    - file_filter
    - file_count
    - independent_file_total
    - buildable_manifest
    - duplicate_manifest_values
    - missing_manifest_identity_counts
    - case_count
    - manifest_case_count
    - project_case_count
    - missing_manifest_case_ids
    - endpoint_status
    - task_support
    - cohort_mode
    - cohort_aggregation
    - sample_selection_fields
    - progression_fields
    - survival_fields
    - required_progression_outcome_count
    - usable_progression_outcome_count
    - manifest_case_ids_without_usable_progression_outcome
    - progression_outcome_coverage_complete
    - gdc_data_release
    - gdc_status
    - promotable
  fields:
    file_filter:
      type: object
      description: Exact GDC files filter used for manifest generation.
    file_count:
      type: integer
      minimum: 0
      description: Number of normalized manifest rows.
    independent_file_total:
      type: integer
      minimum: 0
      description: Independent GDC count query total for the same file filter.
    buildable_manifest:
      type: boolean
      description: True only when normalized manifest rows satisfy package-build identity completeness and uniqueness constraints.
    duplicate_manifest_values:
      type: object
      description: Duplicate normalized manifest values keyed by case_submitter_id, sample_submitter_id, and file_id.
    missing_manifest_identity_counts:
      type: object
      description: Missing normalized manifest identity counts keyed by case_submitter_id, sample_submitter_id, and file_id.
    case_count:
      type: integer
      minimum: 0
      description: Number of manifest-linked cases available for endpoint validation.
    manifest_case_count:
      type: integer
      minimum: 0
      description: Number of distinct case IDs referenced by the normalized manifest.
    project_case_count:
      type: integer
      minimum: 0
      description: Number of project cases returned by the GDC cases query.
    missing_manifest_case_ids:
      type: array
      items: string
      description: Manifest case IDs missing from the GDC cases response.
    endpoint_status:
      type: string
      allowed_values:
        - progression-ready
        - survival-only
        - missing-endpoint
    task_support:
      type: object
      tasks: [progression-risk, overall-survival]
      state_values:
        - blocked-missing-endpoint
        - blocked-incomplete-outcome-coverage
        - buildable-candidate
      description: >
        Per-task diagnostic derived from dataset-level endpoint_status and
        observed endpoint fields. This is report metadata, not dataset
        promotion.
    cohort_mode:
      type: string
      allowed_values:
        - unique-manifest-no-policy-applied
        - unresolved-cohort
      deferred_modes:
        - patient-level-single-sample
        - sample-level-with-patient-outcomes
      description: >
        Current manifest aggregation state. This slice only classifies manifest
        identity completeness and uniqueness, so it emits
        unique-manifest-no-policy-applied (all required identities are present
        and unique, but no curated patient-level selection rule applied) or
        unresolved-cohort (duplicate or missing identities present). The
        design's patient-level-single-sample and
        sample-level-with-patient-outcomes modes require an actual selection
        or evaluation policy and are deferred; they are not emitted yet.
    cohort_aggregation:
      type: object
      blocking_reasons:
        - ambiguous-patient-expression-files
      description: >
        Duplicate patient/sample/file diagnostics. selected_policy is null until
        a real patient-level selection policy is implemented.
    sample_selection_fields:
      type: object
      description: >
        Report of which sample-selection signals the open GDC manifest exposes.
        Each entry carries a basis: structured-field (a live present/count probe
        of a queried field), id-token-heuristic (derived from the sample id
        string, e.g. CD138 positivity), or not-queried (a field the recipe does
        not currently request from GDC, so it cannot flip to present without a
        query change). Used to scope a future patient-level selection policy.
    progression_fields:
      type: array
      items: string
      description: Open GDC fields supporting usable progression outcomes.
    survival_fields:
      type: array
      items: string
      description: Open GDC survival fields observed for reporting only.
    required_progression_outcome_count:
      type: integer
      minimum: 0
      description: Number of manifest cases requiring usable progression or censoring outcomes.
    usable_progression_outcome_count:
      type: integer
      minimum: 0
      description: Number of case records with usable progression or censoring outcomes.
    manifest_case_ids_without_usable_progression_outcome:
      type: array
      items: string
      description: Manifest case IDs lacking usable progression or censoring outcomes.
    progression_outcome_coverage_complete:
      type: boolean
      description: True only when every manifest case has usable progression or censoring outcome metadata.
    gdc_data_release:
      type: string
      nullable: true
    gdc_status:
      type: object
    promotable:
      type: boolean
      description: True only when the dry-run endpoint status is progression-ready, no manifest cases are missing, progression outcome coverage is complete, and the normalized manifest is buildable.
  refusal_conditions:
    - missing_manifest_case_ids is nonempty
    - endpoint_status is survival-only
    - endpoint_status is missing-endpoint
    - progression_outcome_coverage_complete is false
    - buildable_manifest is false
    - cohort_mode is unresolved-cohort

package_outputs:
  expression:
    path: data/expression.parquet
    format: parquet
    required_columns:
      - case_submitter_id
      - sample_submitter_id
      - gene_id
      - gene_name
      - measure
      - value
    default_measure: tpm_unstranded
  samples:
    path: data/samples.parquet
    format: parquet
    required_columns:
      - case_id
      - case_submitter_id
      - sample_submitter_id
      - sample_type
      - file_id
      - file_name
  outcomes:
    path: data/outcomes.parquet
    format: parquet
    required_columns:
      - case_id
      - case_submitter_id
      - progression_or_recurrence
      - time_to_event_days
      - event_observed
    constraints:
      - Every manifest case_submitter_id must have a usable progression outcome row.
      - time_to_event_days is derived from days_to_recurrence for events and days_to_last_follow_up for censored rows.
  heldout_patient_split:
    path: splits/heldout_patient_v1.parquet
    format: parquet
    method: sha256(case_submitter_id || split_salt)
    default_split_salt: mmrf-commpass-heldout-patient-v1
    required_columns:
      - case_submitter_id
      - split
      - split_basis
    allowed_splits:
      - train
      - validation
      - test
    constraints:
      - No case_submitter_id may appear in more than one split.
      - Train, validation, and test splits must be nonempty when at least three patients are available.
      - split_basis is the lowercase hex SHA-256 rank key.

build_summary:
  path: reports/build-summary.json
  format: json
  required_fields:
    - measure
    - expression_rows
    - sample_rows
    - outcome_rows
    - split_rows
    - split_salt
    - split_method
  split_method: sha256(case_submitter_id || split_salt)

datapackage:
  path: datapackage.yaml
  generated_by: recipe/build_datapackage.py
  requirements:
    - reports/validation.json gdc_data_release must match the command argument.
    - reports/build-summary.json split_salt must match the command argument.
    - Resource hashes and byte counts are computed from local files under SCIENCE_COMMONS_DATA_ROOT.
